name: Publish extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Read extension metadata
        id: metadata
        shell: bash
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          artifact="vscode-extension-$publisher.$name-$version.vsix"

          echo "extension_id=$publisher.$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Package extension
        id: package
        shell: bash
        run: |
          mkdir -p dist
          vsix="dist/${{ steps.metadata.outputs.artifact }}"
          npx --yes @vscode/vsce@3.9.1 package --no-yarn --out "$vsix"
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30
